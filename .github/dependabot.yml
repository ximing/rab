# Dependabot：只处理有安全风险的升级，不追最新版。
#
# `open-pull-requests-limit: 0` 关闭 version updates（每周一批「跟上最新」的 PR），
# 不影响仓库设置里已开启的 Dependabot security updates —— 有 GHSA 时仍会单独开 PR。
#
# 安全 PR 的合并策略见 .github/workflows/dependabot-auto-merge.yml：
# 纯 devDependencies 的 patch/minor 安全修复验证后可自动合并；
# 生产依赖与 major 留给人工审阅。
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - '/'
      - '/configs/*'
      - '/packages/*'
      - '/examples/*'
      - '/website'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    rebase-strategy: auto

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci(actions)'
