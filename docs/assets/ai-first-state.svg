<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RAB AI First reactive state architecture</title>
  <desc id="desc">Human interfaces and AI tools read and write the same observable service state.</desc>
  <defs>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4dd9e8"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f3b562"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#79a8ff"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#10141c"/>

  <g font-family="Arial, sans-serif">
    <rect x="56" y="92" width="256" height="332" rx="20" fill="#2a211b" stroke="#f3b562" stroke-width="2"/>
    <text x="84" y="136" fill="#f3b562" font-size="14" font-weight="700" letter-spacing="2">HUMAN</text>
    <text x="84" y="174" fill="#fff4e2" font-size="28" font-weight="700">Human</text>
    <rect x="84" y="204" width="200" height="58" rx="12" fill="#3a2d23" stroke="#8e6335"/>
    <text x="184" y="239" text-anchor="middle" fill="#fff4e2" font-size="17">React UI</text>
    <rect x="84" y="280" width="200" height="58" rx="12" fill="#3a2d23" stroke="#8e6335"/>
    <text x="184" y="315" text-anchor="middle" fill="#fff4e2" font-size="17">DevTools</text>
    <text x="84" y="382" fill="#cda87a" font-size="14">inspect · compose · respond</text>

    <rect x="384" y="68" width="432" height="380" rx="24" fill="#17272f" stroke="#4dd9e8" stroke-width="2"/>
    <text x="600" y="116" text-anchor="middle" fill="#4dd9e8" font-size="14" font-weight="700" letter-spacing="2">SHARED FOUNDATION</text>
    <text x="600" y="156" text-anchor="middle" fill="#e7fcff" font-size="27" font-weight="700">Shared Reactive State</text>
    <rect x="428" y="188" width="344" height="68" rx="14" fill="#203b45" stroke="#4dd9e8"/>
    <text x="600" y="229" text-anchor="middle" fill="#e7fcff" font-size="19">Observable</text>
    <rect x="428" y="278" width="344" height="68" rx="14" fill="#203b45" stroke="#4dd9e8"/>
    <text x="600" y="319" text-anchor="middle" fill="#e7fcff" font-size="19">Service Container</text>
    <text x="600" y="396" text-anchor="middle" fill="#9dd9df" font-size="14">read and write · one source of truth</text>

    <rect x="888" y="92" width="256" height="332" rx="20" fill="#1b2338" stroke="#79a8ff" stroke-width="2"/>
    <text x="916" y="136" fill="#79a8ff" font-size="14" font-weight="700" letter-spacing="2">AI OPERATORS</text>
    <text x="916" y="174" fill="#edf3ff" font-size="28" font-weight="700">AI</text>
    <rect x="916" y="204" width="200" height="58" rx="12" fill="#263452" stroke="#5576b4"/>
    <text x="1016" y="239" text-anchor="middle" fill="#edf3ff" font-size="17">Agent</text>
    <rect x="916" y="270" width="200" height="50" rx="12" fill="#263452" stroke="#5576b4"/>
    <text x="1016" y="301" text-anchor="middle" fill="#edf3ff" font-size="17">Web MCP</text>
    <rect x="916" y="334" width="200" height="50" rx="12" fill="#263452" stroke="#5576b4"/>
    <text x="1016" y="365" text-anchor="middle" fill="#edf3ff" font-size="17">Skills</text>
    <text x="916" y="404" fill="#a5b8e3" font-size="14">reason · call · automate</text>

    <path d="M312 222 C338 222 350 222 378 222" fill="none" stroke="#f3b562" stroke-width="3" marker-end="url(#arrow-amber)"/>
    <path d="M378 246 C350 246 338 246 312 246" fill="none" stroke="#f3b562" stroke-width="3" marker-end="url(#arrow-amber)"/>
    <path d="M816 222 C844 222 856 222 888 222" fill="none" stroke="#79a8ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M888 246 C856 246 844 246 816 246" fill="none" stroke="#79a8ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="345" y="204" text-anchor="middle" fill="#cda87a" font-size="12">read / write</text>
    <text x="855" y="204" text-anchor="middle" fill="#a5b8e3" font-size="12">read / write</text>

    <rect x="438" y="470" width="324" height="38" rx="19" fill="#203b45" stroke="#2b6870"/>
    <text x="600" y="495" text-anchor="middle" fill="#9dd9df" font-size="15">Actions / Events</text>
  </g>

  <text x="600" y="540" text-anchor="middle" fill="#8b96a8" font-family="Arial, sans-serif" font-size="16">One state surface · many operators</text>
</svg>
